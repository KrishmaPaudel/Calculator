
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="design.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="calculator-container">

        
        <header class="calc-header">
            <div class="brand">
                
                <span class="logo-text">Calculator</span>
            </div>
            <div class="header-actions">
                <button id="toggle-history" class="icon-btn" title="View History">📜</button>
                <button id="toggle-theme" class="icon-btn" title="Toggle Dark/Light Mode">☀️</button>
            </div>
        </header>

     
        <main class="calc-display">
            <div class="history-expression" id="history-expression"></div>
            <div class="current-value" id="current-value">0</div>
        </main>

        <!-- History Panel Overlay -->
        <aside class="history-panel hidden" id="history-panel">
            <div class="history-header">
                <span>Calculation History</span>
                <button id="clear-history" class="text-btn">Clear</button>
            </div>
            <ul class="history-list" id="history-list">
                <li class="empty-msg">No history yet</li>
            </ul>
        </aside>

        <section class="keypad-grid">

            <!-- Main Calculator -->
            <div class="main-keys">
                <button class="btn btn-util" data-action="clear">AC</button>
                <button class="btn btn-util" data-action="delete">DEL</button>
                <button class="btn btn-util" data-action="percent">%</button>
                <button class="btn btn-operator" data-action="divide">÷</button>

                <button class="btn btn-num" data-val="7">7</button>
                <button class="btn btn-num" data-val="8">8</button>
                <button class="btn btn-num" data-val="9">9</button>
                <button class="btn btn-operator" data-action="multiply">×</button>

                <button class="btn btn-num" data-val="4">4</button>
                <button class="btn btn-num" data-val="5">5</button>
                <button class="btn btn-num" data-val="6">6</button>
                <button class="btn btn-operator" data-action="subtract">−</button>

                <button class="btn btn-num" data-val="1">1</button>
                <button class="btn btn-num" data-val="2">2</button>
                <button class="btn btn-num" data-val="3">3</button>
                <button class="btn btn-operator" data-action="add">+</button>

                <button class="btn btn-num btn-zero" data-val="0">0</button>
                <button class="btn btn-num" data-val=".">.</button>
                <button class="btn btn-equals" data-action="calculate">=</button>
            </div>
        </section>

    </div>

    <script src="logic.js"></script>
</body>
</html>
